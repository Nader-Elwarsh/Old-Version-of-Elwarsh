<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#001b4d"><link rel="manifest" href="manifest.json?v=11.4.1"><link rel="icon" type="image/png" sizes="192x192" href="icon-192-v11-4-1.png"><link rel="apple-touch-icon" href="icon-192-v11-4-1.png"><title>المخزن</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="print-share.css"></head><body><main class="page"><a class="back" href="index.html">← الرئيسية</a>
<div class="page-head"><h1>📦 المخزن</h1><div class="section-actions"><a class="icon-btn small-btn" href="settings.html#part-categories">⚙️ التصنيفات</a><button type="button" class="icon-btn small-btn" onclick="toggle('bulkPriceBox')">💲 تعديل الأسعار بالجملة</button><button class="primary small-btn" onclick="toggle('partForm')">➕ قطعة جديدة</button></div></div>
<div id="bulkPriceBox" class="form hidden">
<div class="page-head" style="margin-bottom:8px"><h2 style="margin:0;font-size:16px">💲 تعديل أسعار المخزن بالجملة</h2></div>
<p class="hint">استخدم هذا القسم لتعديل أسعار كل الأصناف (أو أصناف تصنيف معيّن) دفعة واحدة، بدل تعديل كل صنف على حدة.</p>
<div class="form-grid">
<label class="wide">نوع العملية<select id="bulkOp"><option value="adjust">➕➖ زيادة/خفض الأسعار الحالية</option><option value="margin">📈 توحيد نسبة الربح لكل الأصناف</option></select></label>
<label>النطاق<select id="bulkScope"></select></label>
<label id="bulkFieldWrap">الحقل المطلوب تعديله<select id="bulkField"><option value="buy">سعر الشراء</option><option value="use">سعر الاستخدام</option><option value="both">سعر الشراء والاستخدام معًا</option></select></label>
<label id="bulkDirWrap">الاتجاه<select id="bulkDir"><option value="up">زيادة ⬆️</option><option value="down">خفض ⬇️</option></select></label>
<label id="bulkTypeWrap">طريقة التعديل<select id="bulkType"><option value="pct">نسبة مئوية %</option><option value="fixed">مبلغ ثابت لكل صنف (ج)</option></select></label>
<label id="bulkValueWrap">القيمة<input id="bulkValue" type="number" min="0" step=".01"></label>
<label id="bulkMarginWrap" class="hidden wide">نسبة الربح المطلوبة % (سعر الاستخدام = سعر الشراء + هذه النسبة)<input id="bulkMarginValue" type="number" min="0" step=".01"></label>
</div>
<div class="actions"><button type="button" class="primary" onclick="applyBulkPriceChange()">✅ تطبيق على الأصناف المطابقة</button><button type="button" class="secondary" onclick="toggle('bulkPriceBox')">إلغاء</button></div>
</div>
<form id="partForm" class="form hidden"><div class="form-grid"><label>اسم القطعة<input id="pName" required autocomplete="off"><div id="partDuplicateHint" class="hint"></div></label><label>الكود<input id="pCode"></label><label>التصنيف<select id="pCategory" required></select></label><label>مكانها في المخزن<input id="pLocation" placeholder="رف / درج / دولاب"></label><label>الكمية<input id="pQty" type="number" min="0" required></label><label>الحد الأدنى<input id="pMin" type="number" min="0" value="0"></label><label>سعر الشراء<input id="pBuy" type="number" min="0" step=".01"></label><label>سعر الاستخدام<input id="pUse" type="number" min="0" step=".01"></label><label>صورة القطعة<input id="pPhoto" type="file" accept="image/*"></label></div><div id="partPhotoPreview"></div><div class="actions"><button class="primary">💾 حفظ وفتح ملف القطعة 360°</button><button type="button" class="secondary" onclick="toggle('partForm')">إلغاء</button></div></form>
<input id="partSearch" class="search" placeholder="🔍 بحث بالاسم أو الكود أو المكان"><div id="partList"></div></main><script src="notif-shared.js"></script>
  <script src="shared-data.js"></script><script src="global-search.js"></script><script src="image-store.js"></script><script src="migrations.js"></script><script src="treasury.js"></script><script src="wallets.js"></script><script src="tasks.js"></script><script src="app-shared.js"></script><script src="app-dashboard-reports.js"></script><script src="app-customers.js"></script><script src="app-devices.js"></script><script src="app-requests.js"></script><script src="app-settings-lists.js"></script><script src="app-parts.js"></script><script src="app-inventory-bulk.js"></script><script src="app-settings.js"></script><script src="app-delete-tools.js"></script><script src="app-route-followup.js"></script><script src="app-data-management.js"></script><script src="app-quick-add.js"></script><script src="app-notifications-bootstrap.js"></script><script src="workshop-mini-simple-ui.js"></script><script src="print-share.js"></script></body></html>
